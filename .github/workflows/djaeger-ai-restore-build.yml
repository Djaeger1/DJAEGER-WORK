name: DJAEGER AI State Restore APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/djaeger-ai-restore-build.yml'
      - 'tools/djaeger-restore-build/project/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: tools/djaeger-restore-build/project
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=tools/djaeger-restore-build/project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.djaeger.ai_backup_restore'" /tmp/badging.txt
          grep -Fq "versionCode='3'" /tmp/badging.txt
          grep -Fq "versionName='1.0.1-choose-file'" /tmp/badging.txt
          grep -Fq "application-label:'DJAEGER AI Restore'" /tmp/badging.txt
          unzip -l "$APK" | grep -Fq "djaeger_logo.xml"
          unzip -l "$APK" | grep -Fq "assets/restore.sh"
          unzip -p "$APK" classes.dex >/tmp/classes.dex
          strings /tmp/classes.dex | grep -Fq "PILIH FILE BACKUP"
          strings /tmp/classes.dex | grep -Fq "RESTORE_STATUS=PASS"
          unzip -p "$APK" assets/restore.sh | grep -Fq "RESTORE_STATUS=PASS"
          echo "VERIFY=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-AI-State-Restore-v1.0.1-choose-file-unsigned
          path: tools/djaeger-restore-build/project/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
