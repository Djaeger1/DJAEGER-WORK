name: DJAEGER WORK Release

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djaeger-work-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate isolated source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'UPDATE_CHANNEL_URL=https://raw.githubusercontent.com/Djaeger1/DJAEGER-WORK/main/release/channel.json' runtime/config/work.env
          grep -Fq '"version":"v2.5.2-isolated"' runtime/manifest.json
          sh -n runtime/worker/tick.sh
          sh -n runtime/worker/handoff.sh
          sh -n runtime/worker/autoupdate.sh
          sh -n runtime/worker/bridge-deploy.sh

      - name: Build ARMv7 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          rm -rf out
          mkdir -p out/payload/bin out/payload/worker out/payload/config
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o out/payload/bin/workd ./workd.go
          cp manifest.json out/manifest.json
          cp worker/tick.sh out/payload/worker/tick.sh
          cp worker/handoff.sh out/payload/worker/handoff.sh
          cp worker/autoupdate.sh out/payload/worker/autoupdate.sh
          cp worker/bridge-deploy.sh out/payload/worker/bridge-deploy.sh
          cp config/work.env out/payload/config/work.env
          chmod 755 out/payload/bin/workd out/payload/worker/*.sh
          cd out
          zip -Xqr ../HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip manifest.json payload
          cd ..
          sha256sum HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip | awk '{print $1}' > HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip.sha256
          printf '{"channel":"stable","version":"v2.5.2-isolated","bundle":"HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip","sha256":"%s"}\n' "$(cat HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip.sha256)" > channel.json

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: HERMES_WORK_RUNTIME_v2.5.2_ISOLATED
          path: runtime/HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip
          retention-days: 30

      - name: Publish isolated stable channel
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp runtime/HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip "$tmp/"
          cp runtime/HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip.sha256 "$tmp/"
          cp runtime/channel.json "$tmp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p release
            cp "$tmp/HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip" release/
            cp "$tmp/HERMES_WORK_RUNTIME_v2.5.2_ISOLATED.zip.sha256" release/
            cp "$tmp/channel.json" release/
            git add release/
            if git diff --cached --quiet; then
              echo "Release channel already current."
              exit 0
            fi
            git commit -m "Publish DJAEGER WORK v2.5.2 isolated baseline"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish after serialized retries." >&2
          exit 1
