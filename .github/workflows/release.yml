name: DJAEGER WORK Release

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djaeger-work-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate isolated source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'UPDATE_CHANNEL_URL=https://raw.githubusercontent.com/Djaeger1/DJAEGER-WORK/main/release/channel.json' runtime/config/work.env
          grep -Fq '"version":"v2.5.25-youtube-oauth-error-detail"' runtime/manifest.json
          sh -n runtime/worker/tick.sh
          sh -n runtime/worker/handoff.sh
          sh -n runtime/worker/autoupdate.sh
          sh -n runtime/worker/bridge-deploy.sh
          sh -n runtime/worker/github-control-shadow.sh
          sh -n runtime/worker/process-converge.sh
          grep -Fq 'GITHUB_CONTROL_URL=https://raw.githubusercontent.com/Djaeger1/DJAEGER-Vercel-Gateway/main/control/desired.json' runtime/config/work.env
          grep -Fq 'github_control_state' runtime/workd.go
          grep -Fq 'github_control_generation' runtime/workd.go
          grep -Fq 'github_control_writes_allowed' runtime/workd.go
          grep -Fq 'androidTransportOnce sync.Once' runtime/workd.go
          grep -Fq 'workd_rss_mb' runtime/workd.go
          grep -Fq 'topRSSProcesses(10)' runtime/workd.go
          grep -Fq 'memBreakdown()' runtime/workd.go
          grep -Fq 'processMemorySummary(15)' runtime/workd.go
          grep -Fq 'smaps_rollup' runtime/workd.go
          grep -Fq 'filepath.Glob("/sys/block/zram*/mm_stat")' runtime/workd.go
          grep -Fq 'echo $$ > "$PID"' runtime/worker/autoupdate.sh
          grep -Fq 'DAEMON_LOCK="$STATE/autoupdate.daemon.lock"' runtime/worker/autoupdate.sh
          ! grep -Fq 'echo $ > "$PID"' runtime/worker/autoupdate.sh
          grep -Fq 'FOUND=""' runtime/worker/tick.sh
          grep -Fq 'plannerSummaryLite()' runtime/workd.go
          grep -Fq 'studioSummaryLite()' runtime/workd.go
          grep -Fq 'jsonPackageSummary(s.scriptDir())' runtime/workd.go
          ! sed -n '/func (s \*S)bridgeSnapshot()/,/func (s \*S)ntfyTopic/p' runtime/workd.go | grep -Fq 'ensure'
          grep -Fq 'handoff.lock' runtime/worker/handoff.sh
          grep -Fq 'handoff.lock' runtime/worker/tick.sh
          grep -Fq '/api/work/memory-audit' runtime/workd.go
          grep -Fq '/api/work/maintenance' runtime/workd.go
          grep -Fq 'GUARDIAN_RECOVERY_PASS' runtime/worker/autoupdate.sh
          grep -Fq 'maintenance.update' runtime/worker/autoupdate.sh
          grep -Fq 'MAX_TEMP_RAW=480' runtime/worker/autoupdate.sh
          sh -n runtime/worker/autoupdate.sh
          grep -Fq 'hermesProcessSummary()' runtime/workd.go
          grep -Fq 'ThreadCount int64' runtime/workd.go
          grep -Fq 'child-helper' runtime/workd.go
          grep -Fq 'last_guard_reason' runtime/workd.go
          grep -Fq 'studioTick=0' runtime/workd.go
          grep -Fq 'worker=reason' runtime/workd.go
          ! sed -n '/func (s \*S)bridgeSnapshot()/,/func (s \*S)ntfyTopic/p' runtime/workd.go | grep -Fq 'process_memory'
          grep -Fq 'MIN_MEM_KB=163840' runtime/worker/autoupdate.sh
          grep -Fq '*memory-forensics*' runtime/worker/autoupdate.sh
          grep -Fq 'status_fallback' runtime/workd.go
          grep -Fq 'RssAnon' runtime/workd.go
          grep -Fq 'VmSwap' runtime/workd.go
          grep -Fq 'memoryPressureSummary()' runtime/workd.go
          grep -Fq 'swapSummary()' runtime/workd.go
          grep -Fq 'topAnonProcesses(10)' runtime/workd.go
          grep -Fq 'processConvergenceInfo()' runtime/workd.go
          grep -Fq 'process-converge.sh' runtime/worker/handoff.sh
          grep -Fq 'HERMES_WORK_RELEASE_WORKERS_ONLY' runtime/worker/process-converge.sh
          grep -Fq 'EMERGENCY_QUARANTINE=0' runtime/config/work.env
          grep -Fq 'GITHUB_CONTROL_SHADOW=0' runtime/config/work.env
          grep -Fq 'EMERGENCY_CPU_THERMAL_QUARANTINE' runtime/worker/tick.sh
          grep -Fq 'EMERGENCY_CPU_THERMAL_QUARANTINE' runtime/worker/handoff.sh
          grep -Fq 'emergency_quarantine' runtime/workd.go
          grep -Fq 'enforceEmergencyQuarantine' runtime/workd.go
          grep -Fq 'case"safe_mode","quarantine"' runtime/workd.go
          grep -Fq 'cpuUsageSummary()' runtime/workd.go
          grep -Fq 'thermalSummary()' runtime/workd.go
          grep -Fq 'cpu_soc_max_c' runtime/workd.go
          grep -Fq 'battery_temp_c' runtime/workd.go
          grep -Fq 'pinnedUpdateChannel' runtime/workd.go
          grep -Fq 'performSignedUpdate' runtime/workd.go
          grep -Fq 'case"remote_update"' runtime/workd.go
          grep -Fq 'loopbackRemote(r)' runtime/workd.go
          grep -Fq 'manifest version mismatch' runtime/workd.go
          ! sed -n '/func (s \*S)bridgeSnapshot()/,/func (s \*S)ntfyTopic/p' runtime/workd.go | grep -Fq '"process_memory"'
          grep -Fq 'MAX_TEMP_RAW=430' runtime/worker/autoupdate.sh
          grep -Fq '/api/work/youtube/oauth' runtime/workd.go
          grep -Fq 'youtubeOAuthStatus()' runtime/workd.go
          grep -Fq 'local_lan_only' runtime/workd.go
          grep -Fq 'oauth2.googleapis.com/token' runtime/workd.go

      - name: Build ARMv7 runtime
        shell: bash
        run: |
          set -euo pipefail
          cd runtime
          rm -rf out
          mkdir -p out/payload/bin out/payload/worker out/payload/config
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o out/payload/bin/workd ./workd.go
          cp manifest.json out/manifest.json
          cp worker/tick.sh out/payload/worker/tick.sh
          cp worker/handoff.sh out/payload/worker/handoff.sh
          cp worker/autoupdate.sh out/payload/worker/autoupdate.sh
          cp worker/bridge-deploy.sh out/payload/worker/bridge-deploy.sh
          cp worker/github-control-shadow.sh out/payload/worker/github-control-shadow.sh
          cp worker/process-converge.sh out/payload/worker/process-converge.sh
          cp config/work.env out/payload/config/work.env
          chmod 755 out/payload/bin/workd out/payload/worker/*.sh
          cd out
          zip -Xqr ../HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip manifest.json payload
          cd ..
          sha256sum HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip | awk '{print $1}' > HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip.sha256
          printf '{"channel":"stable","version":"v2.5.25-youtube-oauth-error-detail","bundle":"HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip","sha256":"%s"}\n' "$(cat HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip.sha256)" > channel.json

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL
          path: runtime/HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip
          retention-days: 30

      - name: Publish isolated stable channel
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp runtime/HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip "$tmp/"
          cp runtime/HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip.sha256 "$tmp/"
          cp runtime/channel.json "$tmp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p release
            cp "$tmp/HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip" release/
            cp "$tmp/HERMES_WORK_RUNTIME_v2.5.25_YOUTUBE_OAUTH_ERROR_DETAIL.zip.sha256" release/
            cp "$tmp/channel.json" release/
            git add release/
            if git diff --cached --quiet; then
              echo "Release channel already current."
              exit 0
            fi
            git commit -m "Publish DJAEGER WORK v2.5.25 YouTube OAuth diagnostics"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish after serialized retries." >&2
          exit 1
