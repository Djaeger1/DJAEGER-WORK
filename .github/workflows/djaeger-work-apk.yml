name: DJAEGER WORK Native APK

on:
  push:
    branches: [main]
    paths:
      - 'hermes-work-terminal/**'
      - '.github/workflows/djaeger-work-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djaeger-work-native-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_WORK_KEYSTORE_B64: ${{ secrets.HERMES_WORK_KEYSTORE_B64 }}
      HERMES_WORK_STORE_PASSWORD: ${{ secrets.HERMES_WORK_STORE_PASSWORD }}
      HERMES_WORK_KEY_ALIAS: ${{ secrets.HERMES_WORK_KEY_ALIAS }}
      HERMES_WORK_KEY_PASSWORD: ${{ secrets.HERMES_WORK_KEY_PASSWORD }}

    steps:
      - name: Checkout isolated DJAEGER WORK
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore approved logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hermes-work-terminal/app/src/main/res/drawable
          cat hermes-work-terminal/logo-b64/logo.*.b64 | base64 -d > hermes-work-terminal/app/src/main/res/drawable/djaeger_logo.png
          echo "db60ad3b00744246520b53a40d3e28c229496591cd41d3feb5c8ae1ab474e6b7  hermes-work-terminal/app/src/main/res/drawable/djaeger_logo.png" | sha256sum -c -

      - name: Restore verified legacy signing identity
        shell: bash
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/hermes_work_terminal.jks"

          if [ -n "${HERMES_WORK_KEYSTORE_B64:-}" ]; then
            printf '%s' "$HERMES_WORK_KEYSTORE_B64" | base64 -d > "$KS"
          else
            LEGACY_COMMIT="1b53002b94918bfefaa298fe0a2c8b93105d8991"
            LEGACY_KEY_URL="https://raw.githubusercontent.com/Djaeger1/DJAEGER-Control-Center/${LEGACY_COMMIT}/hermes-work-terminal/signing/hermes_work_terminal.jks.b64"
            curl -fsSL --retry 3 --retry-delay 2 "$LEGACY_KEY_URL" | base64 -d > "$KS"
            echo "HERMES_WORK_STORE_PASSWORD=HermesWork2026" >> "$GITHUB_ENV"
            echo "HERMES_WORK_KEY_ALIAS=hermeswork" >> "$GITHUB_ENV"
            echo "HERMES_WORK_KEY_PASSWORD=HermesWork2026" >> "$GITHUB_ENV"
          fi

          chmod 600 "$KS"
          echo "HERMES_WORK_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=SIGNED" >> "$GITHUB_ENV"

          PASS="${HERMES_WORK_STORE_PASSWORD:-HermesWork2026}"
          ALIAS="${HERMES_WORK_KEY_ALIAS:-hermeswork}"
          keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" > /tmp/hermes-work-key.txt
          grep -Fq "SHA256: 5B:2F:E7:06:90:26:A0:36:6D:0C:28:E6:26:EF:83:6F:B4:61:41:D6:ED:13:1A:8C:D5:BC:2E:D0:6B:77:4E:9D" /tmp/hermes-work-key.txt
          grep -Fq "Owner: CN=HERMES WORK Terminal" /tmp/hermes-work-key.txt
          echo "Legacy signing identity verified."

      - name: Verify preserved application contract
        shell: bash
        run: |
          set -euo pipefail
          SRC=hermes-work-terminal/app/src/main/java/com/hermes/workdashboard/MainActivity.java
          python3 - "$SRC" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8').read()
          required=[
            'String[] labels = {"KERJA", "RISET", "RENCANA", "WAWASAN", "SISTEM", "PEMBARUAN"};',
            'case 0: buildWork(body);',
            'case 1: buildResearch(body);',
            'case 2: buildPlanner(body);',
            'case 3: buildInsights(body);',
            'case 4: buildSystem(body);',
            'case 5: buildUpdate(body);',
            '/api/work/run-research',
            '/api/work/brief',
            '/api/work/channel',
            '/api/work/knowledge',
            '/api/work/recovery',
            '/api/work/youtube/oauth',
            'KONEKSI YOUTUBE',
            'HUBUNGKAN YOUTUBE',
            'DJAEGER WORK'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              print("Missing preserved contracts:", missing)
              raise SystemExit(1)
          print("Six-menu DJAEGER WORK contract preserved.")
          PY
          grep -Fq 'applicationId "com.hermes.workdashboard"' hermes-work-terminal/app/build.gradle
          grep -Fq 'versionCode 132' hermes-work-terminal/app/build.gradle
          grep -Fq 'versionName "1.3.2"' hermes-work-terminal/app/build.gradle
          grep -Fq 'Executors.newFixedThreadPool(4)' "$SRC"
          grep -Fq 'X-Djaeger-Remote-Key' "$SRC"
          grep -Fq '● REMOTE' "$SRC"
          grep -Fq 'Djaeger1/DJAEGER-WORK/main/release/channel.json' "$SRC"
          grep -Fq 'APP_VERSION=1.3.2' "$SRC"
          grep -Fq '/status-feed' "$SRC"
          ! grep -Fq 'generateUpdateReport(out, null);' "$SRC"
          test ! -e hermes-work-terminal/signing/hermes_work_terminal.jks.b64

      - name: Build release APK
        working-directory: hermes-work-terminal
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace

      - name: Verify APK identity and signature mode
        shell: bash
        run: |
          set -euo pipefail
          SIGNED_APK=hermes-work-terminal/app/build/outputs/apk/release/app-release.apk
          UNSIGNED_APK=hermes-work-terminal/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -s "$SIGNED_APK" ]; then
            APK="$SIGNED_APK"
          elif [ -s "$UNSIGNED_APK" ]; then
            APK="$UNSIGNED_APK"
          else
            echo "Release APK not found" >&2
            find hermes-work-terminal/app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi
          unzip -t "$APK"

          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.hermes.workdashboard'" /tmp/badging.txt
          grep -Fq "versionCode='132'" /tmp/badging.txt
          grep -Fq "versionName='1.3.2'" /tmp/badging.txt
          grep -Fq "application-label:'DJAEGER WORK'" /tmp/badging.txt

          if [ "$SIGNING_MODE" = "SIGNED" ]; then
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
            grep -Fq "certificate SHA-256 digest: 5b2fe7069026a0366d0c28e626ef836fb46141d6ed131a8cd5bc2ed06b774e9d" /tmp/apksigner.txt
            OUT=DJAEGER_WORK_Dashboard_v1.3.2_SIGNED.apk
          else
            if "$BT/apksigner" verify "$APK" >/dev/null 2>&1; then
              echo "Unexpected signature in validation-only build" >&2
              exit 1
            fi
            OUT=DJAEGER_WORK_Dashboard_v1.3.2_UNSIGNED.apk
          fi

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256.txt
          printf '%s\n' "$SIGNING_MODE" > SIGNING_STATUS.txt
          echo "APK_OUTPUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-WORK-Native-v1.3.2-${{ env.SIGNING_MODE }}
          path: |
            ${{ env.APK_OUTPUT }}
            SHA256.txt
            SIGNING_STATUS.txt
          retention-days: 30
