name: HERMES Auto Studio

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hermes-auto-studio.yml'
      - 'hermes-auto-studio/**'

permissions:
  contents: write

concurrency:
  group: djaeger-work-hermes-auto-studio
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Validate Auto Studio quota/backoff contract
        if: github.event_name == 'push'
        run: |
          bash -n hermes-auto-studio/render.sh
          python3 -m py_compile hermes-auto-studio/ai_video_scene.py
          python3 hermes-auto-studio/ai_video_scene.py --selftest
      - name: Run resumable zero-card Auto Studio
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_FEED: https://hermes-work-chatgpt-relay-v3-production.up.railway.app/studio-feed
          PROVIDER_QUOTA_BACKOFF_SECONDS: "14400"
          PROVIDER_QUOTA_BACKOFF_MAX_SECONDS: "43200"
          PROVIDER_TRANSIENT_BACKOFF_SECONDS: "3600"
          PROVIDER_TRANSIENT_BACKOFF_MAX_SECONDS: "14400"
        run: bash hermes-auto-studio/render.sh
