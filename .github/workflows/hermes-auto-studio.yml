name: HERMES Auto Studio

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hermes-auto-studio.yml'
      - 'hermes-auto-studio/**'

permissions:
  contents: write

concurrency:
  group: djaeger-work-hermes-auto-studio
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Preflight free AI video provider on renderer changes
        if: github.event_name == 'push'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "gradio_client>=1.6,<2" pillow
          python3 hermes-auto-studio/ai_video_scene.py --smoke --output /tmp/djaeger-ai-video-preflight.mp4 --duration 1.0
          ffprobe -v error -show_entries format=duration,size -of json /tmp/djaeger-ai-video-preflight.mp4
      - name: Run zero-card Auto Studio
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_FEED: https://hermes-work-chatgpt-relay-v3-production.up.railway.app/studio-feed
        run: bash hermes-auto-studio/render.sh
