name: HERMES Auto Studio

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hermes-auto-studio.yml'
      - 'hermes-auto-studio/**'

permissions:
  contents: write

concurrency:
  group: djaeger-work-hermes-auto-studio
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Run zero-card Auto Studio
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_FEED: https://hermes-work-chatgpt-relay-v3-production.up.railway.app/studio-feed
        run: bash hermes-auto-studio/render.sh
