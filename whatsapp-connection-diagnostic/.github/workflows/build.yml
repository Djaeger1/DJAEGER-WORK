name: Build APK
on:
  push:
    branches: [ main ]
    paths:
      - 'whatsapp-connection-diagnostic/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build debug APK
        working-directory: whatsapp-connection-diagnostic
        run: gradle --no-daemon assembleDebug
      - name: Smoke-test APK
        run: |
          test -s whatsapp-connection-diagnostic/app/build/outputs/apk/debug/app-debug.apk
          unzip -t whatsapp-connection-diagnostic/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-connection-diagnostic-debug
          path: whatsapp-connection-diagnostic/app/build/outputs/apk/debug/app-debug.apk
